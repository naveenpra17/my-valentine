spring:
  application:
    name: romantic-universe-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  entry-lock:
    enabled: ${ENTRY_LOCK_ENABLED:false}
    answer: ${ENTRY_LOCK_ANSWER:}
