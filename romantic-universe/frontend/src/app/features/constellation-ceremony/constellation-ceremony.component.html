<section class="constellation-ceremony cine-scene cine-scene-silence" #section id="constellation-ceremony" appChapterVisit="7">
  <div class="constellation-ceremony__vignette cine-vignette"></div>

  <div class="constellation-ceremony__content">
    <p class="cine-intimate constellation-ceremony__line" #line1El>{{ line1() }}</p>
    <p class="cine-editorial-sm constellation-ceremony__look" #line2El>{{ line2() }}</p>
    @if (hasStars()) {
      <canvas class="constellation-ceremony__canvas" #canvas aria-hidden="true"></canvas>
    } @else {
      <p class="cine-whisper constellation-ceremony__empty">Every discovery you make leaves a star behind. Keep exploring — they'll gather here.</p>
    }
  </div>
</section>
