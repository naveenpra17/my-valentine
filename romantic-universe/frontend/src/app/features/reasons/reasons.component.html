<section class="reasons section" #section id="reasons">
  <p class="reasons__chapter">Chapter 5</p>
  <h2 class="section-title">Things I Adore About You</h2>
  <p class="section-subtitle">Tap a card to reveal why</p>

  @if (loading()) {
    <div class="reasons__state">Loading...</div>
  } @else if (error()) {
    <div class="reasons__state reasons__state--error">{{ error() }}</div>
  } @else {
    <div class="reasons__grid">
      @for (reason of reasons(); track reason.id) {
        <article
          class="reason-card"
          [class.reason-card--expanded]="isExpanded(reason.id)"
          #reasonCard
          appTilt
          (click)="toggleReason(reason.id)"
          (keydown.enter)="toggleReason(reason.id)"
          tabindex="0"
          role="button"
          [attr.aria-expanded]="isExpanded(reason.id)"
        >
          <div class="reason-card__inner glass-card">
            <div class="reason-card__front">
              <span class="reason-card__icon">💗</span>
              <h3 class="reason-card__label">{{ reason.shortLabel }}</h3>
              <span class="reason-card__hint">tap me</span>
            </div>
            <div class="reason-card__back">
              <p class="reason-card__message">{{ reason.longMessage }}</p>
            </div>
          </div>
        </article>
      }
    </div>
  }
</section>
