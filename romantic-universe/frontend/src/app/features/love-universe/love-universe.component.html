<section class="universe cine-scene" #section id="universe" data-act="2" appChapterVisit="1">
  <div class="universe__vignette cine-vignette"></div>
  <div class="cine-fade-edge cine-fade-edge--bottom"></div>

  <div class="universe__canvas-wrap" #canvasHost></div>

  @if (introVisible()) {
    <div class="universe__intro" #introText>
      <p class="cine-whisper universe__intro-line">{{ line1() }}</p>
      <p class="cine-statement universe__intro-line">{{ line2() }}</p>
    </div>
  }

  <div class="universe__overlay">
    <p class="universe__hint cine-micro">Tap a floating photograph in the stars</p>
    <div class="universe__scroll-hint">
      <span class="cine-micro">Continue</span>
      <div class="universe__chevron" aria-hidden="true"></div>
    </div>
  </div>
</section>
