<section class="universe cine-scene" #section id="universe" data-act="2" appChapterVisit="1">
  <div class="universe__vignette cine-vignette"></div>
  <div class="cine-fade-edge cine-fade-edge--bottom"></div>

  <div class="universe__canvas-wrap" #canvasHost></div>

  @if (showUniverseCursor()) {
    <div
      class="universe__cursor"
      [class.universe__cursor--near]="cursorNearDiscovery()"
      [style.left.%]="cursorX()"
      [style.top.%]="cursorY()"
      aria-hidden="true"
    >
      <span class="universe__cursor-core"></span>
      <span class="universe__cursor-trail"></span>
    </div>
  }
  @if (introVisible()) {
    <div class="universe__intro" #introText>
      <p class="cine-whisper universe__intro-line">{{ line1() }}</p>
      <p class="cine-statement universe__intro-line">{{ line2() }}</p>
    </div>
  }

  <div class="universe__overlay" [class.universe__overlay--hunt]="discoveryHunt()" [class.universe__overlay--quiet]="introVisible()">
    @if (discoveryHunt()) {
      <p class="universe__hint universe__hint--hunt cine-discovery-hint">Something is still out there.</p>
      <button class="cine-enter-btn universe__back-heart" type="button" (click)="returnToHeart()">
        Back to the heart
      </button>
    } @else if (!introVisible()) {
      <p class="universe__hint cine-whisper">Something is floating out there.</p>
    }
    @if (!introVisible()) {
      <div class="universe__scroll-hint">
        <span class="cine-micro">Continue</span>
        <div class="universe__chevron" aria-hidden="true"></div>
      </div>
    }
  </div>
</section>
