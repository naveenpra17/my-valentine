<section
  class="cine-scene"
  [class]="'open-when open-when--mood-' + activeMood()"
  #section
  id="open-when"
  data-act="7"
>
  <div class="open-when__mood-layer" #moodLayer aria-hidden="true"></div>
  <div class="open-when__vignette cine-vignette"></div>
  <div class="cine-fade-edge cine-fade-edge--top"></div>

  <div class="open-when__content">
    <header class="open-when__header">
      <h2 class="cine-statement open-when__title cine-thought">{{ title() }}</h2>
      <p class="cine-whisper open-when__subtitle">{{ subtitle() }}</p>
    </header>

    @if (loading()) {
      <div class="open-when__state cine-body">Preparing envelopes...</div>
    } @else {
      <div class="open-when__grid" [class.open-when__grid--dimmed]="openedId() !== null">
        @for (msg of messages(); track msg.id; let i = $index) {
          <div
            class="envelope-wrap"
            [class.envelope-wrap--open]="isOpen(msg.id)"
            [class.envelope-wrap--dimmed]="openedId() !== null && !isOpen(msg.id)"
            #envelope
          >
            <button
              class="envelope"
              type="button"
              (click)="openEnvelope(msg, i)"
              [attr.aria-expanded]="isOpen(msg.id)"
              [attr.aria-label]="'Open envelope: ' + msg.envelopeLabel"
            >
              <div class="envelope__glow" aria-hidden="true"></div>
              <div class="envelope__flap"></div>
              <div class="envelope__body">
                <span class="envelope__seal" aria-hidden="true"></span>
                <span class="envelope__label">{{ msg.envelopeLabel }}</span>
              </div>
            </button>
          </div>
        }
      </div>
    }
  </div>

  @if (openedMessage(); as msg) {
    <div class="open-when__letter-backdrop" (click)="closeEnvelope()" aria-hidden="true"></div>
    <div class="open-when__letter-panel" #letterPanel role="dialog" aria-modal="true">
      <div class="open-when__letter-inner">
        <p class="open-when__letter-label cine-micro">{{ msg.envelopeLabel }}</p>
        <p class="open-when__letter-message cine-letter cine-thought">{{ msg.message }}</p>
        <button class="cine-enter-btn open-when__close" type="button" (click)="closeEnvelope()">
          Fold it away
        </button>
      </div>
    </div>
  }

  <div class="cine-fade-edge cine-fade-edge--bottom"></div>
</section>
