<section class="flower cine-scene" #section id="flower" data-act="8c">
  <div class="flower__vignette cine-vignette"></div>
  <div class="cine-fade-edge cine-fade-edge--top"></div>

  <header class="flower__header">
    <p class="act-marker">Act VIII · Flower</p>
    <h2 class="cine-statement flower__title">{{ title() }}</h2>
    <p class="cine-whisper flower__subtitle">{{ subtitle() }}</p>
  </header>

  <div class="flower__stage">
    <div class="flower__glow" #glow aria-hidden="true"></div>
    <div class="flower__ground" aria-hidden="true"></div>

    <button
      class="flower__plant"
      type="button"
      [class.flower__plant--bloomed]="phase() === 'bloomed'"
      [class.flower__plant--growing]="phase() === 'growing'"
      (click)="plantSeed()"
      [disabled]="phase() !== 'seed'"
      [attr.aria-label]="phase() === 'seed' ? 'Plant the seed' : 'Flower growing'"
    >
      <div class="flower__seed" #seed>
        <span class="flower__seed-body" aria-hidden="true"></span>
      </div>

      <div class="flower__stem" #stem></div>

      <div class="flower__leaves" #leaves>
        <span class="flower__leaf flower__leaf--left" aria-hidden="true"></span>
        <span class="flower__leaf flower__leaf--right" aria-hidden="true"></span>
      </div>

      <div class="flower__bloom" #bloom>
        <span class="flower__petal flower__petal--1" aria-hidden="true"></span>
        <span class="flower__petal flower__petal--2" aria-hidden="true"></span>
        <span class="flower__petal flower__petal--3" aria-hidden="true"></span>
        <span class="flower__petal flower__petal--4" aria-hidden="true"></span>
        <span class="flower__petal flower__petal--5" aria-hidden="true"></span>
        <span class="flower__center" aria-hidden="true"></span>
      </div>

      @if (phase() === 'seed') {
        <span class="flower__tap-hint cine-micro">plant the seed</span>
      }
    </button>

    @if (showMessage()) {
      <div class="flower__message" #messageEl>
        <p class="cine-letter">{{ flowerMessage() }}</p>
      </div>
    }
  </div>

  <div class="cine-fade-edge cine-fade-edge--bottom"></div>
</section>
