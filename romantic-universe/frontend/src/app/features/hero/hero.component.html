<section class="hero cine-scene" #section id="hero" data-act="3">
  <div class="hero__vignette cine-vignette"></div>
  <div class="cine-fade-edge cine-fade-edge--top"></div>
  <div class="cine-fade-edge cine-fade-edge--bottom"></div>

  <div class="hero__pin" #pinWrap>
    <div class="hero__inner">
      <div class="hero__photo-stage" #photoStage>
        <div class="hero__photo-inner" #photoInner>
          @if (!imageError()) {
            <img
              class="hero__photo"
              [src]="imageUrl()"
              [alt]="'Photo of ' + herName()"
              loading="lazy"
              (error)="onImageError()"
            />
          } @else {
            <div class="hero__photo hero__photo--placeholder" aria-hidden="true">
              <span class="hero__placeholder-icon">💗</span>
            </div>
          }
          <div class="hero__photo-glow"></div>
        </div>
        <div class="hero__dust" #dustLayer aria-hidden="true"></div>
      </div>

      <div class="hero__text" #textBlock>
        <p class="act-marker">Chapter II</p>
        <p class="cine-whisper hero__discover">{{ discoverLine1() }}</p>
        <p class="cine-editorial-sm hero__discover2">{{ discoverLine2() }}</p>
        <h2 class="cine-editorial hero__title">{{ title() }}</h2>
        <blockquote class="cine-intimate hero__quote">{{ line1() }}</blockquote>
        <p class="cine-body hero__line2">{{ line2() }}</p>
        <p class="hero__name cine-micro">— for {{ herName() }}</p>
      </div>
    </div>
  </div>
</section>
