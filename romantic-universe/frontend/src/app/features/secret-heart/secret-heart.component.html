@if (!heartFound) {
  <button
    class="secret-heart"
    type="button"
    (click)="reveal()"
    aria-label="Hidden surprise"
  >
    <span class="secret-heart__glow" aria-hidden="true"></span>
    <span class="secret-heart__icon" aria-hidden="true">♥</span>
  </button>
}

@if (showModal()) {
  <div
    class="secret-heart__modal"
    #modal
    role="dialog"
    aria-modal="true"
    aria-label="Secret discovered"
    (click)="close()"
  >
    <div class="secret-heart__card" (click)="$event.stopPropagation()">
      <p class="secret-heart__found cine-micro">Secret discovered</p>
      <p class="secret-heart__message cine-letter">{{ secretMessage() }}</p>
      @if (discoveredCount > 1) {
        <p class="secret-heart__count cine-micro">{{ discoveredCount }} secrets found</p>
      }
      <button class="cine-enter-btn" type="button" (click)="close()">Close</button>
    </div>
  </div>
}
