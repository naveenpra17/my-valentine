<section class="finale" #section id="finale">
  <canvas class="finale__canvas" #canvas aria-hidden="true"></canvas>

  <div class="finale__content">
    @if (showLines()) {
      <div class="finale__lines">
        <p class="finale__line" #line1El>{{ line1() }}</p>
        <p class="finale__line" #line2El>{{ line2() }}</p>
        <p class="finale__line" #line3El>{{ line3() }}</p>
        <p class="finale__line" #line4El>{{ line4() }}</p>
      </div>
    }

    @if (showFinal()) {
      <blockquote class="finale__final" #finalMsg>
        {{ finalMessage() }}
      </blockquote>
    }

    @if (showButton()) {
      <button
        class="finale__surprise btn-primary"
        (click)="triggerSurprise()"
        [disabled]="surpriseTriggered()"
      >
        {{ surpriseTriggered() ? '✨ Surprise delivered!' : 'One last surprise ✨' }}
      </button>
    }

    <footer class="finale__credit">
      <p>{{ footerCredit() }}</p>
    </footer>
  </div>
</section>
