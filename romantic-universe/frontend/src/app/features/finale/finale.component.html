<section class="finale cine-scene" #section id="finale" data-act="10">
  <div class="finale__pin" #pinWrap>
    <div class="finale__vignette cine-vignette"></div>
    <canvas class="finale__canvas" #canvas aria-hidden="true"></canvas>

    <div class="finale__content">
      <p class="act-marker">Act X · Finale</p>

      <div class="finale__lines" [class.finale__lines--visible]="sequenceStarted()">
        <p class="finale__line cine-statement" #line1El>{{ line1() }}</p>
        <p class="finale__line cine-statement" #line2El>{{ line2() }}</p>
        <p class="finale__line cine-statement" #line3El>{{ line3() }}</p>
        <p class="finale__line cine-statement" #line4El>{{ line4() }}</p>
      </div>

      @if (showFinal()) {
        <p class="finale__personal cine-intimate" #personalEl>{{ personalLine() }}</p>
        <blockquote class="finale__final cine-letter" #finalMsg>
          {{ finalMessage() }}
        </blockquote>
        <p class="finale__for cine-micro">Made just for you, {{ herName() }}. ❤️</p>
      }

      @if (showButton()) {
        <button
          class="finale__surprise cine-enter-btn"
          type="button"
          (click)="triggerSurprise()"
          [disabled]="surpriseTriggered()"
        >
          {{ surpriseTriggered() ? 'Surprise delivered' : 'One last surprise' }}
        </button>
      }

      <footer class="finale__credit" #creditEl>
        <p class="cine-micro">{{ footerCredit() }}</p>
      </footer>
    </div>
  </div>
</section>
