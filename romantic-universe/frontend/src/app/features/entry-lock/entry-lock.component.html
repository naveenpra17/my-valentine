<div class="entry-lock" [class.shake]="shake()">
  <app-starfield [density]="100" />

  <div class="entry-lock__content">
    <div class="entry-lock__icon">🔒</div>
    <h1 class="entry-lock__title">A little secret first...</h1>
    <p class="entry-lock__question">{{ displayQuestion() }}</p>

    <form class="entry-lock__form" (ngSubmit)="submit()">
      <input
        type="text"
        class="entry-lock__input"
        [(ngModel)]="answer"
        name="answer"
        placeholder="Your answer..."
        autocomplete="off"
        [disabled]="verifying()"
        aria-label="Entry answer"
      />
      <button type="submit" class="btn-primary" [disabled]="verifying()">
        {{ verifying() ? 'Checking...' : 'Unlock ✨' }}
      </button>
    </form>

    @if (error()) {
      <p class="entry-lock__error" role="alert">{{ error() }}</p>
    }
  </div>
</div>
