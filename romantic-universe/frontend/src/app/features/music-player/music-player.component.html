<div class="music-player">
  <button
    class="music-player__fab"
    type="button"
    (click)="onSoundToggle()"
    [attr.aria-label]="music.muted() ? 'Sound off — tap to hear the universe' : 'Sound on'"
    [attr.aria-pressed]="music.enabled() && !music.muted()"
  >
    @if (music.enabled() && !music.muted()) {
      <span class="music-player__icon music-player__icon--on" aria-hidden="true">◦</span>
    } @else {
      <span class="music-player__icon" aria-hidden="true">○</span>
    }
  </button>
  <span class="music-player__hint cine-micro" aria-hidden="true">
    {{ music.muted() ? 'Sound off' : (music.enabled() ? 'Sound on' : 'Sound') }}
  </span>
</div>
