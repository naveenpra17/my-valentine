# Render Blueprint — use with repo root at romantic-universe/
# Database: Neon PostgreSQL — set DATABASE_URL manually in Render env vars
services:
  - type: web
    name: romantic-universe-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ENTRY_LOCK_ENABLED
        value: "true"
      - key: ENTRY_LOCK_ANSWER
        sync: false
