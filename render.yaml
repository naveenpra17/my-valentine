# Repo-root Render Blueprint (GitHub: naveenpra17/valentine)
databases:
  - name: romantic-universe-db
    plan: free
    databaseName: romantic_universe
    user: romantic_user

services:
  - type: web
    name: romantic-universe-api
    runtime: docker
    plan: free
    dockerfilePath: ./romantic-universe/backend/Dockerfile
    dockerContext: ./romantic-universe/backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: romantic-universe-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ENTRY_LOCK_ENABLED
        value: "true"
      - key: ENTRY_LOCK_ANSWER
        sync: false
