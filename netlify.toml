# Repo-root Netlify config (GitHub: naveenpra17/valentine)
[build]
  base    = "romantic-universe/frontend"
  command = "npm ci && npm run build"
  publish = "romantic-universe/frontend/dist/frontend/browser"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
